<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Downloading… – Bilibili Downloader</title>
  <link rel="stylesheet" href="../shared.css">
  <link rel="stylesheet" href="task.css">
</head>
<body>
  <main>
    <h1 id="filename">Preparing…</h1>
    <p id="description" class="muted"></p>

    <section class="stream">
      <div class="line"><span>Video</span><span id="videoText" class="muted">waiting</span></div>
      <progress id="videoBar" max="1" value="0"></progress>
    </section>
    <section class="stream">
      <div class="line"><span>Audio</span><span id="audioText" class="muted">waiting</span></div>
      <progress id="audioBar" max="1" value="0"></progress>
    </section>

    <p id="status"></p>
    <div id="actions" class="actions" hidden></div>
    <p class="muted small">Keep this tab open until the download finishes. Everything happens locally in your browser.</p>
  </main>
  <script type="module" src="task.js"></script>
</body>
</html>
